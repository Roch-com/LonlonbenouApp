# Vérification à chaque poussée et sur chaque demande de fusion.
#
# Trois portes, dans l'ordre du plus rapide au plus lent : les types, le style,
# puis les tests. Une erreur de type ne mérite pas d'attendre trois minutes de
# suite de tests pour être signalée.
#
# La suite tourne aussi contre un vrai PostgreSQL, et non seulement contre le
# dépôt en mémoire : c'est là qu'apparaissent les écarts de comportement — une
# contrainte d'unicité, un fuseau, une transaction — qu'un double en mémoire ne
# reproduit jamais.

name: Vérification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée annule la vérification en cours sur la même branche :
# inutile de payer deux fois pour un état dépassé.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: verification
          POSTGRES_DB: lonlonbenu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `npm install` : le verrou est produit sous Windows et n'y inscrit pas
      # les binaires Linux d'esbuild, rollup et lightningcss. `npm ci` échouerait
      # ici pour la même raison que chez l'hébergeur.
      - name: Installer
        run: npm install

      - name: Types
        run: npm run typecheck

      - name: Style
        run: npm run lint

      - name: Format
        run: npm run format:verifier

      - name: Tests (mémoire)
        run: npm test

      - name: Tests (PostgreSQL réel)
        run: npm test
        env:
          LONLONBENU_TEST_DATABASE_URL: postgresql://postgres:verification@localhost:5432/lonlonbenu_test
